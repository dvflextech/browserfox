<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Celestial Fox Startpage</title>
  <style>
    /* Celestial Blue & Gold Palette */
    :root {
      --bg-dark: #050811;
      --card-bg: rgba(10, 16, 32, 0.65);
      --card-border: rgba(234, 179, 8, 0.25); /* Subtle gold rim */
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-gold: #f59e0b;
      --accent-blue: #38bdf8;
      --glow-gold: rgba(245, 158, 11, 0.35);
      --glow-blue: rgba(56, 189, 248, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background Artwork Layer */
    .bg-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.82) contrast(1.05);
      pointer-events: none;
    }

    /* Vignette overlay to smooth out edge contrast */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(5, 8, 17, 0.1) 0%, rgba(5, 8, 17, 0.75) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Main Content Container */
    .content-container {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 620px;
      padding: 20px;
      margin-top: 60px; /* Offset slightly to frame artwork nicely */
    }

    /* Sleek Centered Search Bar */
    .search-form {
      width: 100%;
    }

    .search-box {
      width: 100%;
      background: rgba(8, 13, 26, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 50px;
      padding: 16px 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--glow-blue);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-box:focus-within {
      transform: translateY(-2px) scale(1.01);
      border-color: var(--accent-gold);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.7), 0 0 30px var(--glow-gold);
      background: rgba(5, 8, 17, 0.9);
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 1.15rem;
      color: var(--text-main);
      text-align: center;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .search-box input::placeholder {
      color: var(--text-sub);
      opacity: 0.75;
    }

    /* Quick Links Grid */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      width: 100%;
    }

    .link-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      padding: 12px 18px;
      border-radius: 18px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .link-card:hover {
      background: rgba(15, 23, 42, 0.85);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px var(--glow-blue);
    }

    /* ANN Live Feed Glass Widget */
    .feed-widget {
      position: absolute;
      bottom: 25px;
      right: 25px;
      z-index: 3;
      width: 320px;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .feed-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--accent-gold);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .feed-title .badge {
      font-size: 0.65rem;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-gold);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .feed-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .feed-item a {
      text-decoration: none;
      color: var(--text-sub);
      font-size: 0.85rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.2s ease;
    }

    .feed-item a:hover {
      color: var(--accent-blue);
    }

    .feed-loading {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-style: italic;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Background Layer -->
  <div class="bg-wrapper">
    <img src="bg.jpg" alt="Celestial Fox">
  </div>
  <div class="bg-overlay"></div>

  <!-- Central Search & Links Layer -->
  <div class="content-container">
    <form class="search-form" action="https://duckduckgo.com/" method="get">
      <div class="search-box">
        <input type="text" name="q" placeholder="Search..." autofocus autocomplete="off">
      </div>
    </form>

    <div class="links-grid">
      <a href="https://nyaa.si" class="link-card">Nyaa</a>
      <a href="https://reddit.com" class="link-card">Reddit</a>
      <a href="https://anilist.co" class="link-card">AniList</a>
      <a href="https://imdb.com" class="link-card">IMDb</a>
    </div>
  </div>

  <!-- ANN Live Feed Widget -->
  <div class="feed-widget">
    <div class="feed-title">
      <span>Anime News</span>
      <span class="badge">ANN</span>
    </div>
    <ul class="feed-list" id="ann-feed">
      <li class="feed-loading">Loading news...</li>
    </ul>
  </div>

  <script>
    async function fetchANNFeed() {
      const feedUrl = encodeURIComponent('https://www.animenewsnetwork.com/all/rss.xml');
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${feedUrl}`;
      const listElement = document.getElementById('ann-feed');

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data.status === 'ok') {
          listElement.innerHTML = '';
          data.items.slice(0, 3).forEach(item => {
            const li = document.createElement('li');
            li.className = 'feed-item';
            li.innerHTML = `<a href="${item.link}" target="_blank" title="${item.title}">${item.title}</a>`;
            listElement.appendChild(li);
          });
        } else {
          listElement.innerHTML = '<li class="feed-loading">Feed unavailable</li>';
        }
      } catch (err) {
        listElement.innerHTML = '<li class="feed-loading">Error loading feed</li>';
      }
    }

    fetchANNFeed();
  </script>
</body>
</html>
