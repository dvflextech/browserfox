<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Celestial Fox Startpage</title>
  <style>
    /* Celestial Palette */
    :root {
      --bg-dark: #03050c;
      --card-bg: rgba(8, 14, 30, 0.75);
      --card-border: rgba(56, 189, 248, 0.25); 
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-gold: #fbbf24;
      --accent-blue: #38bdf8;
      --accent-pink: #f472b6;
      --glow-blue: rgba(56, 189, 248, 0.45);
      --glow-gold: rgba(251, 191, 36, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background Artwork - Pure CSS Background Property optimized for Ultrawide */
    .bg-wrapper {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
      filter: brightness(0.85) contrast(1.08);
      animation: ambientPulse 8s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { transform: scale(1); filter: brightness(0.85) contrast(1.08); }
      100% { transform: scale(1.02); filter: brightness(0.92) contrast(1.12); }
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(3, 5, 12, 0.2) 0%, rgba(3, 5, 12, 0.82) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Main Container - Centered stably without shifting */
    .content-container {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
      max-width: 572px;
      padding: 22px;
    }

    /* Dynamic Search Bar & Dropdown Wrapper */
    .search-form { 
      width: 100%; 
      position: relative;
    }

    .search-box {
      width: 100%;
      background: rgba(6, 11, 24, 0.85);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 55px;
      padding: 18px 35px;
      box-shadow: 0 13px 38px rgba(0, 0, 0, 0.6), 0 0 28px var(--glow-blue);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .search-box:focus-within {
      transform: translateY(-3px) scale(1.015);
      border-color: var(--accent-gold);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.8), 0 0 38px var(--glow-gold);
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 1.27rem;
      color: var(--text-main);
      text-align: center;
      font-weight: 500;
    }

    .search-box input::placeholder {
      color: var(--text-sub);
      opacity: 0.7;
    }

    /* Search Suggestions / History Dropdown Panel */
    .search-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: rgba(4, 7, 18, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.7);
      z-index: 100;
      overflow: hidden;
      display: none;
      flex-direction: column;
    }

    .search-dropdown.visible {
      display: flex;
    }

    .dropdown-section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent-gold);
      padding: 10px 18px 4px 18px;
      font-weight: 700;
      opacity: 0.8;
    }

    .dropdown-item {
      padding: 11px 18px;
      font-size: 0.95rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s ease, color 0.15s ease;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover, .dropdown-item.selected {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-blue);
    }

    .dropdown-item .item-type {
      font-size: 0.75rem;
      color: var(--text-sub);
      opacity: 0.6;
    }

    /* Links Grid - Scaled up icons an additional 25% (24px * 1.25 = 30px) and adjusted card padding */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 13px;
      width: 100%;
    }

    .link-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      padding: 19px 0;
      border-radius: 18px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .link-card img.site-icon {
      width: 30px;
      height: 30px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      transition: transform 0.25s ease;
    }

    .link-card:hover img.site-icon {
      transform: scale(1.15);
    }

    .link-card:hover {
      background: rgba(15, 23, 42, 0.9);
      transform: translateY(-4px);
    }
    .link-card.gold:hover { border-color: var(--accent-gold); box-shadow: 0 11px 33px var(--glow-gold); }
    .link-card.pink:hover { border-color: var(--accent-pink); box-shadow: 0 11px 33px rgba(244, 114, 182, 0.4); }
    .link-card.blue:hover { border-color: var(--accent-blue); box-shadow: 0 11px 33px var(--glow-blue); }

    /* Left Debug Console Drawer */
    .debug-drawer {
      position: absolute;
      left: -418px;
      top: 2%;
      height: 96%;
      width: 418px;
      background: rgba(4, 7, 15, 0.92);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-right: 1px solid var(--card-border);
      border-radius: 0 26px 26px 0;
      z-index: 10;
      transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 17px 0 55px rgba(0,0,0,0.65);
      display: flex;
      flex-direction: column;
    }

    body.debug-open .debug-drawer {
      left: 0;
    }

    .debug-toggle {
      position: absolute;
      right: -48px;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 110px;
      background: rgba(4, 7, 15, 0.92);
      backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-left: none;
      border-radius: 0 18px 18px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 0.88rem;
      transition: all 0.2s ease;
      box-shadow: 6px 0 17px rgba(0,0,0,0.3);
    }

    .debug-toggle:hover {
      color: var(--accent-blue);
      background: rgba(15, 23, 42, 0.95);
    }

    .debug-header {
      padding: 22px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 0.99rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clear-cache-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text-main);
      padding: 4px 9px;
      font-size: 0.77rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .clear-cache-btn:hover { background: rgba(255,255,255,0.2); }

    .debug-logs {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.83rem;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .log-entry {
      padding: 7px 9px;
      background: rgba(255,255,255,0.03);
      border-left: 3px solid var(--accent-blue);
      border-radius: 4px;
      word-break: break-all;
    }
    .log-entry.success { border-left-color: #22c55e; color: #a3e635; }
    .log-entry.error { border-left-color: #ef4444; color: #fca5a5; }
    .log-entry.warn { border-left-color: var(--accent-gold); color: #fde047; }

    /* Right Updates Drawer */
    .drawer {
      position: absolute;
      right: 0;
      top: 2%;
      height: 96%;
      width: 484px;
      background: rgba(6, 10, 22, 0.88);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-left: 1px solid var(--card-border);
      border-radius: 26px 0 0 26px;
      z-index: 10;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -17px 0 55px rgba(0,0,0,0.65);
      display: flex;
      flex-direction: column;
    }

    body.drawer-closed .drawer {
      right: -484px;
    }

    .drawer-toggle {
      position: absolute;
      left: -48px;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 110px;
      background: rgba(6, 10, 22, 0.88);
      backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-right: none;
      border-radius: 18px 0 0 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-blue);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 0.88rem;
      transition: all 0.2s ease;
      box-shadow: -6px 0 17px rgba(0,0,0,0.3);
    }

    .drawer-toggle:hover {
      color: var(--accent-gold);
      background: rgba(15, 23, 42, 0.95);
    }

    /* Tabs Header */
    .tabs-header {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 22px 22px 0 22px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 11px 0;
      font-size: 0.94rem;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      color: var(--accent-gold);
      border-bottom: 2px solid var(--accent-gold);
    }

    .tab-btn:hover:not(.active) {
      color: var(--text-main);
    }

    /* Tab Content Panels */
    .tab-content {
      flex: 1;
      padding: 22px;
      overflow-y: auto;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .feed-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .feed-item {
      display: flex;
      gap: 13px;
      align-items: center;
      padding-bottom: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .feed-item:last-child {
      border-bottom: none;
    }

    .feed-thumb {
      width: 70px;
      height: 53px;
      border-radius: 9px;
      object-fit: cover;
      flex-shrink: 0;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .feed-icon-fallback {
      width: 70px;
      height: 53px;
      border-radius: 9px;
      flex-shrink: 0;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.49rem;
      box-shadow: inset 0 0 13px rgba(56, 189, 248, 0.1);
    }

    .feed-info {
      flex: 1;
      min-width: 0;
    }

    .feed-item a {
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.99rem;
      line-height: 1.35;
      font-weight: 500;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.2s ease;
      margin-bottom: 4px;
    }

    .feed-item a:hover {
      color: var(--accent-blue);
    }

    .tab-content#pv .feed-item a:hover { color: var(--accent-pink); }
    .tab-content#mal .feed-item a:hover { color: var(--accent-gold); }

    .feed-meta {
      font-size: 0.83rem;
      color: var(--text-sub);
      opacity: 0.85;
    }

    .feed-loading {
      text-align: center;
      color: var(--text-sub);
      font-style: italic;
      font-size: 1.05rem;
      margin-top: 33px;
    }

    ::-webkit-scrollbar { width: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
  </style>
</head>
<body class="debug-closed">

  <div class="bg-wrapper" id="bg-wrapper"></div>
  <div class="bg-overlay"></div>

  <!-- Left Debug Console Drawer -->
  <div class="debug-drawer">
    <div class="debug-toggle" onclick="toggleDebug()">DEBUG</div>
    <div class="debug-header">
      <span>FEED DIAGNOSTICS</span>
      <button class="clear-cache-btn" onclick="clearFeedCache()">Clear Cache</button>
    </div>
    <div class="debug-logs" id="debug-logs">
      <div class="log-entry">Console initialized. Ready for feed events...</div>
    </div>
  </div>

  <!-- Central Search & Links -->
  <div class="content-container">
    <form class="search-form" id="search-form" action="https://duckduckgo.com/" method="get">
      <div class="search-box">
        <input type="text" id="search-input" name="q" placeholder="Search" autofocus autocomplete="off">
      </div>
      <div class="search-dropdown" id="search-dropdown">
        <!-- Dynamically populated search history & live suggestions -->
      </div>
    </form>
    <div class="links-grid">
      <a href="https://nyaa.si" class="link-card blue" title="Nyaa"><img class="site-icon" src="https://www.google.com/s2/favicons?domain=nyaa.si&sz=64" alt="Nyaa"></a>
      <a href="https://anilist.co" class="link-card gold" title="AniList"><img class="site-icon" src="https://www.google.com/s2/favicons?domain=anilist.co&sz=64" alt="AniList"></a>
      <a href="https://myanimelist.net" class="link-card blue" title="MAL"><img class="site-icon" src="https://www.google.com/s2/favicons?domain=myanimelist.net&sz=64" alt="MAL"></a>
      <a href="https://www.youtube.com" class="link-card pink" title="YouTube"><img class="site-icon" src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64" alt="YouTube"></a>
      <a href="https://www.twitch.tv" class="link-card pink" title="Twitch"><img class="site-icon" src="https://www.google.com/s2/favicons?domain=twitch.tv&sz=64" alt="Twitch"></a>
      <a href="https://reddit.com" class="link-card blue" title="Reddit"><img class="site-icon" src="https://www.google.com/s2/favicons?domain=reddit.com&sz=64" alt="Reddit"></a>
      <a href="https://sukebei.nyaa.si" class="link-card pink" title="Sukebei"><img class="site-icon" src="https://www.google.com/s2/favicons?domain=sukebei.nyaa.si&sz=64" alt="Sukebei"></a>
      <a href="https://imdb.com" class="link-card gold" title="IMDb"><img class="site-icon" src="https://www.google.com/s2/favicons?domain=imdb.com&sz=64" alt="IMDb"></a>
    </div>
  </div>

  <!-- Right Collapsible Updates Drawer (Defaults Open) -->
  <div class="drawer">
    <div class="drawer-toggle" onclick="toggleDrawer()">UPDATES</div>
    
    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab('ann')">ANN</button>
      <button class="tab-btn" onclick="switchTab('mal')">MAL</button>
      <button class="tab-btn" onclick="switchTab('nyaa')">NYAA</button>
      <button class="tab-btn" onclick="switchTab('pv')">Previews</button>
    </div>

    <!-- ANN Content -->
    <div class="tab-content active" id="ann">
      <ul class="feed-list" id="list-ann"><li class="feed-loading">Fetching ANN...</li></ul>
    </div>
    <!-- MAL Content -->
    <div class="tab-content" id="mal">
      <ul class="feed-list" id="list-mal"><li class="feed-loading">Fetching MAL...</li></ul>
    </div>
    <!-- Nyaa Content -->
    <div class="tab-content" id="nyaa">
      <ul class="feed-list" id="list-nyaa"><li class="feed-loading">Fetching Nyaa...</li></ul>
    </div>
    <!-- Previews / Trailers Content -->
    <div class="tab-content" id="pv">
      <ul class="feed-list" id="list-pv"><li class="feed-loading">Fetching Previews...</li></ul>
    </div>
  </div>

  <script>
    const BUILD_REVISION = 'rev-16-random-bgart';

    // List of background image filenames available in the bgart/ directory
    const bgArtFiles = [
      'bg1.jpg',
      'bg2.jpg',
      'bg3.jpg',
      'bg4.jpg',
      'bg5.jpg'
      // You can easily append more filenames here as your collection grows
    ];

    function initRandomBackground() {
      const bgWrapper = document.getElementById('bg-wrapper');
      if (!bgWrapper || bgArtFiles.length === 0) return;
      const randomIndex = Math.floor(Math.random() * bgArtFiles.length);
      const chosenBg = `bgart/${bgArtFiles[randomIndex]}`;
      bgWrapper.style.backgroundImage = `url('${chosenBg}')`;
      logDebug(`Loaded random background: ${chosenBg}`, 'success');
    }

    function logDebug(message, type = 'info') {
      const logsContainer = document.getElementById('debug-logs');
      if (!logsContainer) return;
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = `[${timestamp}] ${message}`;
      logsContainer.appendChild(entry);
      logsContainer.scrollTop = logsContainer.scrollHeight;
    }

    function toggleDrawer() {
      document.body.classList.toggle('drawer-closed');
      document.body.classList.toggle('drawer-open');
    }

    function toggleDebug() {
      document.body.classList.toggle('debug-open');
      document.body.classList.toggle('debug-closed');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function clearFeedCache() {
      Object.keys(localStorage).forEach(key => {
        if (key.startsWith('celestial_cache_')) {
          localStorage.removeItem(key);
        }
      });
      logDebug('Local storage feed cache cleared. Reloading page recommended.', 'success');
      alert('Feed cache cleared! Refresh the page to fetch fresh feeds.');
    }

    /* Enhanced Search & History Integration */
    const searchInput = document.getElementById('search-input');
    const searchForm = document.getElementById('search-form');
    const searchDropdown = document.getElementById('search-dropdown');
    const HISTORY_KEY = 'celestial_search_history';
    let selectedIndex = -1;
    let currentSuggestions = [];

    function getSearchHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveSearchQuery(query) {
      if (!query || !query.trim()) return;
      let history = getSearchHistory();
      query = query.trim();
      history = history.filter(item => item.toLowerCase() !== query.toLowerCase());
      history.unshift(query);
      if (history.length > 10) history = history.slice(0, 10);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    }

    async function fetchDuckDuckGoSuggestions(query) {
      if (!query || query.trim().length === 0) return [];
      try {
        const url = `https://duckduckgo.com/ac/?q=${encodeURIComponent(query)}&type=list`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
        const res = await fetch(proxyUrl);
        if (!res.ok) return [];
        const data = await res.json();
        const parsed = JSON.parse(data.contents);
        if (parsed && Array.isArray(parsed[1])) {
          return parsed[1].slice(0, 5);
        }
      } catch (e) {
        logDebug(`Suggestion fetch warning: ${e.message}`, 'warn');
      }
      return [];
    }

    function renderDropdown(historyItems, suggestions) {
      searchDropdown.innerHTML = '';
      currentSuggestions = [];

      let hasContent = false;

      if (historyItems.length > 0) {
        const title = document.createElement('div');
        title.className = 'dropdown-section-title';
        title.textContent = 'Recent Searches';
        searchDropdown.appendChild(title);

        historyItems.forEach(item => {
          const div = document.createElement('div');
          div.className = 'dropdown-item';
          div.innerHTML = `<span>${item}</span><span class="item-type">history</span>`;
          div.addEventListener('mousedown', (e) => {
            e.preventDefault();
            searchInput.value = item;
            submitSearch(item);
          });
          searchDropdown.appendChild(div);
          currentSuggestions.push(item);
          hasContent = true;
        });
      }

      if (suggestions.length > 0) {
        const title = document.createElement('div');
        title.className = 'dropdown-section-title';
        title.textContent = 'Suggestions';
        searchDropdown.appendChild(title);

        suggestions.forEach(item => {
          if (historyItems.includes(item)) return;
          const div = document.createElement('div');
          div.className = 'dropdown-item';
          div.innerHTML = `<span>${item}</span><span class="item-type">suggestion</span>`;
          div.addEventListener('mousedown', (e) => {
            e.preventDefault();
            searchInput.value = item;
            submitSearch(item);
          });
          searchDropdown.appendChild(div);
          currentSuggestions.push(item);
          hasContent = true;
        });
      }

      if (hasContent) {
        searchDropdown.classList.add('visible');
      } else {
        searchDropdown.classList.remove('visible');
      }
    }

    function submitSearch(query) {
      saveSearchQuery(query);
      searchInput.value = query;
      searchForm.submit();
    }

    let debounceTimer = null;
    searchInput.addEventListener('input', (e) => {
      const val = e.target.value;
      selectedIndex = -1;
      clearTimeout(debounceTimer);

      const history = getSearchHistory();
      const filteredHistory = val.trim() 
        ? history.filter(h => h.toLowerCase().includes(val.toLowerCase())).slice(0, 4)
        : history.slice(0, 5);

      if (!val.trim()) {
        renderDropdown(filteredHistory, []);
        return;
      }

      debounceTimer = setTimeout(async () => {
        const suggestions = await fetchDuckDuckGoSuggestions(val);
        renderDropdown(filteredHistory, suggestions);
      }, 200);
    });

    searchInput.addEventListener('focus', () => {
      const history = getSearchHistory().slice(0, 5);
      if (history.length > 0 || searchInput.value.trim()) {
        renderDropdown(history, []);
      }
    });

    searchInput.addEventListener('blur', () => {
      setTimeout(() => {
        searchDropdown.classList.remove('visible');
      }, 200);
    });

    searchInput.addEventListener('keydown', (e) => {
      const items = searchDropdown.querySelectorAll('.dropdown-item');
      if (!searchDropdown.classList.contains('visible') || items.length === 0) {
        if (e.key === 'Enter') {
          saveSearchQuery(searchInput.value);
        }
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedIndex = (selectedIndex + 1) % items.length;
        items.forEach((it, idx) => it.classList.toggle('selected', idx === selectedIndex));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedIndex = (selectedIndex - 1 + items.length) % items.length;
        items.forEach((it, idx) => it.classList.toggle('selected', idx === selectedIndex));
      } else if (e.key === 'Enter') {
        if (selectedIndex >= 0 && selectedIndex < currentSuggestions.length) {
          e.preventDefault();
          const selectedVal = currentSuggestions[selectedIndex];
          searchInput.value = selectedVal;
          submitSearch(selectedVal);
        } else {
          saveSearchQuery(searchInput.value);
        }
      }
    });

    searchForm.addEventListener('submit', (e) => {
      saveSearchQuery(searchInput.value);
    });

    function getCategoryFallbackIcon(listId, title = '', description = '') {
      const text = (title + ' ' + description).toLowerCase();

      if (listId === 'list-nyaa') {
        if (text.includes('batch') || text.includes('complete') || text.includes('1080p') || text.includes('bd')) return '📦';
        if (text.includes('manga') || text.includes('chapter') || text.includes('volume') || text.includes('raw')) return '📖';
        if (text.includes('music') || text.includes('ost') || text.includes('flac') || text.includes('mp3') || text.includes('single')) return '🎵';
        if (text.includes('raw') || text.includes('tv')) return '📺';
        return '🍥';
      }

      if (listId === 'list-pv') {
        return '🎬';
      }

      if (listId === 'list-mal') {
        if (text.includes('interview') || text.includes('creator') || text.includes('author')) return '🎤';
        if (text.includes('manga') || text.includes('chapter') || text.includes('release')) return '📚';
        if (text.includes('figure') || text.includes('merch') || text.includes('goods')) return '🛍️';
        if (text.includes('movie') || text.includes('film') || text.includes('trailer')) return '🎞️';
        return '🌸';
      }

      if (text.includes('interview') || text.includes('talk')) return '🎙️';
      if (text.includes('manga') || text.includes('novel') || text.includes('chapter')) return '📖';
      if (text.includes('trailer') || text.includes('pv') || text.includes('promo') || text.includes('teaser')) return '🎬';
      if (text.includes('figure') || text.includes('goods') || text.includes('merchandise') || text.includes('nendoroid')) return '✨';
      if (text.includes('game') || text.includes('visual novel') || text.includes('rpg')) return '🎮';
      if (text.includes('music') || text.includes('single') || text.includes('album') || text.includes('opening') || text.includes('ending')) return '🎵';
      if (text.includes('delay') || text.includes('postpone') || text.includes('hiatus')) return '⚠️';
      if (text.includes('cast') || text.includes('voice') || text.includes('staff') || text.includes('anime')) return '🍙';

      return '🏮';
    }

    async function loadFeedWithCache(rssUrl, listId, maxItems = 7) {
      const listElement = document.getElementById(listId);
      const cacheKey = `celestial_cache_${listId}`;
      const cacheTimeKey = `${cacheKey}_time`;
      
      const cachedData = localStorage.getItem(cacheKey);
      const cachedTime = localStorage.getItem(cacheTimeKey);
      const twentyFourHours = 24 * 60 * 60 * 1000;

      if (cachedData && cachedTime && (Date.now() - parseInt(cachedTime, 10) < twentyFourHours)) {
        logDebug(`[${listId}] Loaded from 24h browser cache successfully`, 'success');
        renderItems(JSON.parse(cachedData), listId, maxItems);
        return;
      }

      logDebug(`[${listId}] Cache expired, missing, or previously failed. Attempting fetch...`);

      const proxies = [
        (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
        (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
        (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
        (url) => `https://thingproxy.freeboard.io/fetch/${url}`
      ];

      let rawText = null;
      for (let i = 0; i < proxies.length; i++) {
        try {
          logDebug(`Trying [${listId}] via proxy #${i + 1}...`);
          const response = await fetch(proxies[i](rssUrl));
          if (!response.ok) throw new Error(`HTTP Status ${response.status}`);
          
          if (i === 0) {
            const data = await response.json();
            if (data && data.contents) { rawText = data.contents; break; }
          } else {
            rawText = await response.text();
            if (rawText) { break; }
          }
        } catch (err) {
          logDebug(`[${listId}] Proxy #${i + 1} failed: ${err.message}`, 'warn');
        }
      }

      if (!rawText) {
        logDebug(`[${listId}] All proxy endpoints failed. Network/CORS block.`, 'error');
        if (cachedData) {
          logDebug(`[${listId}] Falling back to stale cached data.`, 'warn');
          renderItems(JSON.parse(cachedData), listId, maxItems);
        } else {
          listElement.innerHTML = '<li class="feed-loading">Connection error (Blocked). Retrying next load...</li>';
        }
        return;
      }

      try {
        const parser = new DOMParser();
        let xmlDoc = parser.parseFromString(rawText, 'text/xml');
        
        if (xmlDoc.querySelector('parsererror')) {
          logDebug(`[${listId}] Strict XML parse error detected. Attempting sanitization...`, 'warn');
          
          let cleanedText = rawText.trim();
          const firstTag = cleanedText.indexOf('<rss') !== -1 ? cleanedText.indexOf('<rss') : cleanedText.indexOf('<feed') !== -1 ? cleanedText.indexOf('<feed') : cleanedText.indexOf('<rdf');
          if (firstTag !== -1) {
            cleanedText = cleanedText.substring(firstTag);
          } else {
            cleanedText = cleanedText.replace(/^[^<]*/, '');
          }

          xmlDoc = parser.parseFromString(cleanedText, 'text/xml');
          
          if (xmlDoc.querySelector('parsererror')) {
            logDebug(`[${listId}] XML strict parser failed. Falling back to HTML tolerance mode...`, 'warn');
            xmlDoc = parser.parseFromString(rawText, 'text/html');
          }
        }

        const items = xmlDoc.querySelectorAll('item, report, entry');
        logDebug(`[${listId}] Parsed ${items.length} entries`, 'success');

        const parsedItems = [];

        items.forEach(item => {
          const title = item.querySelector('title')?.textContent || '';
          
          let link = item.querySelector('link')?.textContent || '';
          if (!link.trim()) {
            const linkTag = item.querySelector('link');
            if (linkTag && linkTag.getAttribute('href')) link = linkTag.getAttribute('href');
          }
          if (!link.trim()) {
            const guid = item.querySelector('guid')?.textContent;
            if (guid && guid.startsWith('http')) link = guid;
          }
          if (!link.trim()) {
            const comments = item.querySelector('comments')?.textContent;
            if (comments && comments.startsWith('http')) link = comments;
          }

          const pubDateStr = item.querySelector('pubDate, date, published, updated, dc\\:date')?.textContent;
          const date = pubDateStr ? new Date(pubDateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

          if (!title.trim() || !link.trim() || link === '#') return;

          const description = item.querySelector('description, content, summary')?.textContent || '';

          if (listId === 'list-pv') {
            const lowerTitle = title.toLowerCase();
            const lowerDesc = description.toLowerCase();
            const hasVideoKeyword = lowerTitle.includes('trailer') || lowerTitle.includes('pv') || lowerTitle.includes('promo') || lowerTitle.includes('teaser') || lowerTitle.includes('video') ||
                                    lowerDesc.includes('trailer') || lowerDesc.includes('pv') || lowerDesc.includes('promo') || lowerDesc.includes('teaser');
            if (!hasVideoKeyword) return;
          }

          let thumbUrl = null;
          const mediaContent = item.getElementsByTagNameNS('*', 'content')[0] || item.querySelector('media\\:content, content');
          if (mediaContent && mediaContent.getAttribute('url')) {
            thumbUrl = mediaContent.getAttribute('url');
          } else {
            const enclosure = item.querySelector('enclosure');
            if (enclosure && enclosure.getAttribute('type')?.startsWith('image')) {
              thumbUrl = enclosure.getAttribute('url');
            }
          }

          if (!thumbUrl && description) {
            const doc = parser.parseFromString(description, 'text/html');
            const img = doc.querySelector('img');
            if (img && img.src) { thumbUrl = img.src; }
          }

          const fallbackIcon = getCategoryFallbackIcon(listId, title, description);

          parsedItems.push({ title, link, date, thumbUrl, fallbackIcon });
        });

        if (parsedItems.length > 0) {
          localStorage.setItem(cacheKey, JSON.stringify(parsedItems));
          localStorage.setItem(cacheTimeKey, Date.now().toString());
          
          renderItems(parsedItems, listId, maxItems);
          logDebug(`[${listId}] Successfully cached ${parsedItems.length} items for 24 hours`, 'success');
        } else {
          logDebug(`[${listId}] Zero valid items found after parsing. Cache skipped.`, 'warn');
          if (cachedData) {
            renderItems(JSON.parse(cachedData), listId, maxItems);
          } else {
            listElement.innerHTML = '<li class="feed-loading">Feed currently empty.</li>';
          }
        }
      } catch (parseErr) {
        logDebug(`[${listId}] Parse Error: ${parseErr.message}. Cache skipped.`, 'error');
        if (cachedData) {
          renderItems(JSON.parse(cachedData), listId, maxItems);
        } else {
          listElement.innerHTML = '<li class="feed-loading">Parsing error.</li>';
        }
      }
    }

    function renderItems(items, listId, maxItems) {
      const listElement = document.getElementById(listId);
      listElement.innerHTML = '';
      
      items.slice(0, maxItems).forEach(item => {
        const li = document.createElement('li');
        li.className = 'feed-item';
        
        let mediaHtml = item.thumbUrl 
          ? `<img class="feed-thumb" src="${item.thumbUrl}" alt="" loading="lazy">` 
          : `<div class="feed-icon-fallback" title="Category Icon">${item.fallbackIcon || '🏮'}</div>`;

        li.innerHTML = `
          ${mediaHtml}
          <div class="feed-info">
            <a href="${item.link}" target="_blank" title="${item.title}">${item.title}</a>
            <div class="feed-meta">${item.date}</div>
          </div>
        `;
        listElement.appendChild(li);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initRandomBackground();
      logDebug(`Startpage active layout loaded. Build Revision: [ ${BUILD_REVISION} ]`, 'success');
    });

    document.body.classList.add('drawer-open');

    loadFeedWithCache('https://www.animenewsnetwork.com/all/rss.xml', 'list-ann');
    loadFeedWithCache('https://myanimelist.net/rss/news.xml', 'list-mal');
    loadFeedWithCache('https://nyaa.si/?page=rss', 'list-nyaa');
    loadFeedWithCache('https://www.animenewsnetwork.com/all/rss.xml', 'list-pv');
  </script>
