<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Celestial Fox Startpage</title>
  <style>
    /* Celestial Palette */
    :root {
      --bg-dark: #03050c;
      --card-bg: rgba(8, 14, 30, 0.75);
      --card-border: rgba(56, 189, 248, 0.25); 
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-gold: #fbbf24;
      --accent-blue: #38bdf8;
      --accent-pink: #f472b6;
      --glow-blue: rgba(56, 189, 248, 0.45);
      --glow-gold: rgba(251, 191, 36, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background Artwork */
    .bg-wrapper {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.85) contrast(1.08);
      animation: ambientPulse 8s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { transform: scale(1); filter: brightness(0.85) contrast(1.08); }
      100% { transform: scale(1.03); filter: brightness(0.92) contrast(1.12); }
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(3, 5, 12, 0.2) 0%, rgba(3, 5, 12, 0.82) 100%);
      z-index: 2;
    }

    /* Main Container - Shifts smoothly when drawer defaults open */
    .content-container {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 680px;
      padding: 20px;
      transform: translateX(-120px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.drawer-closed .content-container {
      transform: translateX(0);
    }

    /* Dynamic Search Bar */
    .search-form { width: 100%; }

    .search-box {
      width: 100%;
      background: rgba(6, 11, 24, 0.85);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 50px;
      padding: 16px 32px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 25px var(--glow-blue);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .search-box:focus-within {
      transform: translateY(-3px) scale(1.015);
      border-color: var(--accent-gold);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.8), 0 0 35px var(--glow-gold);
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 1.15rem;
      color: var(--text-main);
      text-align: center;
      font-weight: 500;
    }

    .search-box input::placeholder {
      color: var(--text-sub);
      opacity: 0.7;
    }

    /* Links Grid */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
    }

    .link-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      padding: 12px 14px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .link-card:hover {
      background: rgba(15, 23, 42, 0.9);
      transform: translateY(-4px);
    }
    .link-card.gold:hover { border-color: var(--accent-gold); color: var(--accent-gold); box-shadow: 0 10px 30px var(--glow-gold); }
    .link-card.pink:hover { border-color: var(--accent-pink); color: var(--accent-pink); box-shadow: 0 10px 30px rgba(244, 114, 182, 0.4); }
    .link-card.blue:hover { border-color: var(--accent-blue); color: var(--accent-blue); box-shadow: 0 10px 30px var(--glow-blue); }

    /* Collapsible Drawer (Defaults Open) */
    .drawer {
      position: absolute;
      right: 0;
      top: 2%;
      height: 96%;
      width: 400px; /* Wider for easier reading */
      background: rgba(6, 10, 22, 0.88);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-left: 1px solid var(--card-border);
      border-radius: 24px 0 0 24px;
      z-index: 10;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -15px 0 50px rgba(0,0,0,0.65);
      display: flex;
      flex-direction: column;
    }

    body.drawer-closed .drawer {
      right: -400px;
    }

    /* Drawer Toggle Button */
    .drawer-toggle {
      position: absolute;
      left: -44px;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 100px;
      background: rgba(6, 10, 22, 0.88);
      backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-right: none;
      border-radius: 16px 0 0 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-blue);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 0.8rem;
      transition: all 0.2s ease;
      box-shadow: -5px 0 15px rgba(0,0,0,0.3);
    }

    .drawer-toggle:hover {
      color: var(--accent-gold);
      background: rgba(15, 23, 42, 0.95);
    }

    /* Tabs Header */
    .tabs-header {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 20px 20px 0 20px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 10px 0;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      color: var(--accent-gold);
      border-bottom: 2px solid var(--accent-gold);
    }

    .tab-btn:hover:not(.active) {
      color: var(--text-main);
    }

    /* Tab Content Panels */
    .tab-content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .feed-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .feed-item {
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .feed-item:last-child {
      border-bottom: none;
    }

    .feed-item a {
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.95rem; /* Larger for readability */
      line-height: 1.45;
      font-weight: 500;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.2s ease;
      margin-bottom: 6px;
    }

    .feed-item a:hover {
      color: var(--accent-blue);
    }

    .tab-content#pv .feed-item a:hover { color: var(--accent-pink); }
    .tab-content#mal .feed-item a:hover { color: var(--accent-gold); }

    .feed-meta {
      font-size: 0.8rem;
      color: var(--text-sub);
      opacity: 0.85;
    }

    .feed-loading {
      text-align: center;
      color: var(--text-sub);
      font-style: italic;
      font-size: 0.95rem;
      margin-top: 30px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
  </style>
</head>
<body>

  <div class="bg-wrapper"><img src="bg.jpg" alt="Celestial Fox"></div>
  <div class="bg-overlay"></div>

  <!-- Central Search & Links -->
  <div class="content-container">
    <form class="search-form" action="https://duckduckgo.com/" method="get">
      <div class="search-box">
        <input type="text" name="q" placeholder="Search" autofocus autocomplete="off">
      </div>
    </form>
    <div class="links-grid">
      <a href="https://nyaa.si" class="link-card blue">Nyaa</a>
      <a href="https://anilist.co" class="link-card gold">AniList</a>
      <a href="https://myanimelist.net" class="link-card blue">MAL</a>
      <a href="https://www.youtube.com" class="link-card pink">YouTube</a>
      <a href="https://www.twitch.tv" class="link-card pink">Twitch</a>
      <a href="https://reddit.com" class="link-card blue">Reddit</a>
      <a href="https://sukebei.nyaa.si" class="link-card pink">Sukebei</a>
      <a href="https://imdb.com" class="link-card gold">IMDb</a>
    </div>
  </div>

  <!-- Collapsible Updates Drawer (Defaults Open) -->
  <div class="drawer">
    <div class="drawer-toggle" onclick="toggleDrawer()">UPDATES</div>
    
    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab('ann')">ANN</button>
      <button class="tab-btn" onclick="switchTab('mal')">MAL</button>
      <button class="tab-btn" onclick="switchTab('nyaa')">NYAA</button>
      <button class="tab-btn" onclick="switchTab('pv')">PVs</button>
    </div>

    <!-- ANN Content -->
    <div class="tab-content active" id="ann">
      <ul class="feed-list" id="list-ann"><li class="feed-loading">Fetching ANN...</li></ul>
    </div>
    <!-- MAL Content -->
    <div class="tab-content" id="mal">
      <ul class="feed-list" id="list-mal"><li class="feed-loading">Fetching MAL...</li></ul>
    </div>
    <!-- Nyaa Content -->
    <div class="tab-content" id="nyaa">
      <ul class="feed-list" id="list-nyaa"><li class="feed-loading">Fetching Nyaa...</li></ul>
    </div>
    <!-- Previews / Trailers Content -->
    <div class="tab-content" id="pv">
      <ul class="feed-list" id="list-pv"><li class="feed-loading">Fetching Previews...</li></ul>
    </div>
  </div>

  <script>
    // Note: No class on body means drawer starts open by default. Clicking toggle adds 'drawer-closed'.
    function toggleDrawer() {
      document.body.classList.toggle('drawer-closed');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    async function fetchRSS(rssUrl, listId, maxItems = 7) {
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
      const listElement = document.getElementById(listId);

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data.status === 'ok') {
          listElement.innerHTML = '';
          data.items.slice(0, maxItems).forEach(item => {
            const date = new Date(item.pubDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            const li = document.createElement('li');
            li.className = 'feed-item';
            li.innerHTML = `
              <a href="${item.link}" target="_blank" title="${item.title}">${item.title}</a>
              <div class="feed-meta">${date}</div>
            `;
            listElement.appendChild(li);
          });
        } else {
          listElement.innerHTML = '<li class="feed-loading">Feed unavailable.</li>';
        }
      } catch (err) {
        listElement.innerHTML = '<li class="feed-loading">Connection error.</li>';
      }
    }

    // Initialize feeds
    fetchRSS('https://www.animenewsnetwork.com/all/rss.xml', 'list-ann');
    fetchRSS('https://myanimelist.net/rss/news.xml', 'list-mal');
    fetchRSS('https://nyaa.si/?page=rss', 'list-nyaa');
    fetchRSS('https://www.animenewsnetwork.com/encyclopedia/reports.xml?id=155&n=50', 'list-pv');
  </script>
</body>
</html>
