<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lolifox Startpage</title>
  <style>
    /* Sleek, Modern, and Cutesy Dark Theme Palette */
    :root {
      --bg-color: #0c090e;              /* OLED Black/Obsidian */
      --card-bg: rgba(22, 19, 28, 0.7); /* Translucent obsidian */
      --card-border: rgba(255, 255, 255, 0.06); /* Nearly invisible border */
      --text-main: #f0f0f5;             /* Soft off-white */
      --text-sub: #b0a9b8;              /* Soft lavender grey */
      --accent-soft: #ba7eff;           /* Soft violet glow */
      --accent-cute: #ff8df0;           /* Cutesy pink accent */
      --glow: rgba(186, 126, 255, 0.3); /* Subtle backdrop blur glow */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Improved Art - More Attractive Definition */
    .art-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      opacity: 0.8; /* Subtle transparency against deep black */
    }

    .art-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      /* Adding a tiny 'shimmer' animation to make the bubbles pop */
      animation: cuteShimmer 5s ease-in-out infinite;
    }

    @keyframes cuteShimmer {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(255,141,240,0.1)); }
      50% { filter: drop-shadow(0 0 15px rgba(255,141,240,0.25)); }
    }

    /* Main UI Layer */
    .content-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
      max-width: 700px;
      padding: 20px;
    }

    /* Modern Glassmorphism Search Bar (Dark) */
    .search-box {
      width: 100%;
      background: rgba(12, 9, 14, 0.8); /* Dark search field */
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--accent-soft); /* Violet border definition */
      border-radius: 40px; /* Cutesy extra rounded */
      padding: 16px 30px;
      box-shadow: 0 10px 40px var(--glow), 0 2px 8px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .search-box:focus-within {
      transform: scale(1.02);
      box-shadow: 0 15px 50px rgba(186, 126, 255, 0.6);
      border-color: var(--accent-cute); /* Pops to pink on focus */
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 1.15rem;
      color: var(--text-main);
      text-align: center;
      font-weight: 500;
    }

    .search-box input::placeholder {
      color: var(--text-sub);
      opacity: 0.6;
      letter-spacing: 0.5px;
    }

    /* Links Grid (Dark Gloss) */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
    }

    .link-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      padding: 14px 20px;
      border-radius: 20px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 1rem;
      text-align: center;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* Modern Pop/Glow on hover */
    .link-card:hover {
      background: var(--bg-color); /* Deep black fill on hover */
      border-color: var(--accent-cute); /* Pink border pops out */
      color: var(--accent-cute);       /* Pink text on hover */
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(255, 141, 240, 0.4);
    }

    /* ANN Feed Widget (Dark Glass) */
    .feed-widget {
      position: absolute;
      bottom: 30px;
      right: 30px;
      z-index: 2;
      width: 340px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .feed-title {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent-soft); /* Soft purple title */
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Red blinking "LIVE" dot */
    .feed-title span:last-child {
      font-size: 0.7rem; 
      opacity: 0.7; 
      background: rgba(255, 141, 240, 0.15);
      color: var(--accent-cute);
      padding: 3px 8px;
      border-radius: 12px;
    }

    .feed-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .feed-item a {
      text-decoration: none;
      color: var(--text-sub);
      font-size: 0.9rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.2s ease, padding-left 0.2s ease;
    }

    .feed-item a:hover {
      color: var(--accent-cute); /* Hover to pink */
      padding-left: 3px; /* Subtle 'bump' effect */
    }

    .feed-loading {
      font-size: 0.9rem;
      color: var(--text-sub);
      font-style: italic;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Background Artwork - More Defined defined definitions -->
  <div class="art-wrapper">
    <img src="https://i.ibb.co/sdFtdsqy/Rj-K0-NAXJCNi9-IVh-OAZq-T-0-YFYu3-bg-rmvd.png" alt="Lolifox background">
  </div>

  <!-- Center Content Layer -->
  <div class="content-container">
    <form class="search-box" action="https://duckduckgo.com/" method="get">
      <input type="text" name="q" placeholder="Search..." autofocus autocomplete="off">
    </form>

    <div class="links-grid">
      <a href="https://nyaa.si" class="link-card">Nyaa</a>
      <a href="https://reddit.com" class="link-card">Reddit</a>
      <a href="https://anilist.co" class="link-card">AniList</a>
      <a href="https://imdb.com" class="link-card">IMDb</a>
    </div>
  </div>

  <!-- Live ANN RSS Feed Widget -->
  <div class="feed-widget">
    <div class="feed-title">
      <span>Anime News Network</span>
      <span>LIVE</span>
    </div>
    <ul class="feed-list" id="ann-feed">
      <li class="feed-loading">マスター、ロード中です... (Master, loading...)</li>
    </ul>
  </div>

  <script>
    // Live ANN feed fetching script (retained for functionality)
    async function fetchANNFeed() {
      const feedUrl = encodeURIComponent('https://www.animenewsnetwork.com/all/rss.xml');
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${feedUrl}`;
      const listElement = document.getElementById('ann-feed');

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data.status === 'ok') {
          listElement.innerHTML = '';
          // Render top 3 headlines
          data.items.slice(0, 3).forEach(item => {
            const li = document.createElement('li');
            li.className = 'feed-item';
            // Render title as HTML to preserve any Japanese/styling if it exists
            li.innerHTML = `<a href="${item.link}" target="_blank" title="${item.title}">${item.title}</a>`;
            listElement.appendChild(li);
          });
        } else {
          listElement.innerHTML = '<li class="feed-loading">Unable to load feed.</li>';
        }
      } catch (err) {
        listElement.innerHTML = '<li class="feed-loading">Error fetching news.</li>';
      }
    }

    fetchANNFeed();
  </script>
</body>
</html>
