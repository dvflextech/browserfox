<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Celestial Fox Startpage</title>
  <style>
    /* Celestial Blue & Gold Palette with Extra Pop */
    :root {
      --bg-dark: #03050c;
      --card-bg: rgba(8, 14, 30, 0.7);
      --card-border: rgba(56, 189, 248, 0.2); 
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-gold: #fbbf24;
      --accent-blue: #38bdf8;
      --accent-pink: #f472b6;
      --glow-blue: rgba(56, 189, 248, 0.45);
      --glow-gold: rgba(251, 191, 36, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background Artwork Layer */
    .bg-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.85) contrast(1.08);
      pointer-events: none;
      animation: ambientPulse 8s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { transform: scale(1); filter: brightness(0.85) contrast(1.08); }
      100% { transform: scale(1.03); filter: brightness(0.92) contrast(1.12); }
    }

    /* Deep Vignette Overlay */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(3, 5, 12, 0.15) 0%, rgba(3, 5, 12, 0.8) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Main Container */
    .content-container {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 720px;
      padding: 20px;
    }

    /* Dynamic Search Bar */
    .search-form {
      width: 100%;
    }

    .search-box {
      width: 100%;
      background: rgba(6, 11, 24, 0.8);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 50px;
      padding: 16px 32px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 25px var(--glow-blue);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .search-box:focus-within {
      transform: translateY(-3px) scale(1.015);
      border-color: var(--accent-gold);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.8), 0 0 35px var(--glow-gold);
      background: rgba(3, 5, 12, 0.92);
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 1.15rem;
      color: var(--text-main);
      text-align: center;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .search-box input::placeholder {
      color: var(--text-sub);
      opacity: 0.7;
    }

    /* Expanded Links Grid (Two Rows) */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
    }

    .link-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      padding: 12px 14px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .link-card:hover {
      background: rgba(15, 23, 42, 0.9);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px var(--glow-gold);
    }

    .link-card.pink:hover {
      border-color: var(--accent-pink);
      color: var(--accent-pink);
      box-shadow: 0 10px 30px rgba(244, 114, 182, 0.4);
    }

    .link-card.blue:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      box-shadow: 0 10px 30px var(--glow-blue);
    }

    /* ANN Live Feed Glass Widget */
    .feed-widget {
      position: absolute;
      bottom: 25px;
      right: 25px;
      z-index: 3;
      width: 320px;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .feed-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--accent-gold);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .feed-title .badge {
      font-size: 0.65rem;
      background: rgba(251, 191, 36, 0.15);
      color: var(--accent-gold);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .feed-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .feed-item a {
      text-decoration: none;
      color: var(--text-sub);
      font-size: 0.85rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.2s ease;
    }

    .feed-item a:hover {
      color: var(--accent-blue);
    }

    .feed-loading {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-style: italic;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Background Layer -->
  <div class="bg-wrapper">
    <img src="bg.jpg" alt="Celestial Fox">
  </div>
  <div class="bg-overlay"></div>

  <!-- Central Search & Expanded Links Layer -->
  <div class="content-container">
    <form class="search-form" action="https://duckduckgo.com/" method="get">
      <div class="search-box">
        <input type="text" name="q" placeholder="Search" autofocus autocomplete="off">
      </div>
    </form>

    <div class="links-grid">
      <a href="https://nyaa.si" class="link-card blue">Nyaa</a>
      <a href="https://anilist.co" class="link-card gold">AniList</a>
      <a href="https://myanimelist.net" class="link-card blue">MAL</a>
      <a href="https://www.youtube.com" class="link-card pink">YouTube</a>
      <a href="https://www.twitch.tv" class="link-card pink">Twitch</a>
      <a href="https://reddit.com" class="link-card blue">Reddit</a>
      <a href="https://sukebei.nyaa.si" class="link-card pink">Sukebei</a>
      <a href="https://imdb.com" class="link-card gold">IMDb</a>
    </div>
  </div>

  <!-- ANN Live Feed Widget -->
  <div class="feed-widget">
    <div class="feed-title">
      <span>Anime News</span>
      <span class="badge">ANN</span>
    </div>
    <ul class="feed-list" id="ann-feed">
      <li class="feed-loading">Loading news...</li>
    </ul>
  </div>

  <script>
    async function fetchANNFeed() {
      const feedUrl = encodeURIComponent('https://www.animenewsnetwork.com/all/rss.xml');
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${feedUrl}`;
      const listElement = document.getElementById('ann-feed');

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data.status === 'ok') {
          listElement.innerHTML = '';
          data.items.slice(0, 3).forEach(item => {
            const li = document.createElement('li');
            li.className = 'feed-item';
            li.innerHTML = `<a href="${item.link}" target="_blank" title="${item.title}">${item.title}</a>`;
            listElement.appendChild(li);
          });
        } else {
          listElement.innerHTML = '<li class="feed-loading">Feed unavailable</li>';
        }
      } catch (err) {
        listElement.innerHTML = '<li class="feed-loading">Error loading feed</li>';
      }
    }

    fetchANNFeed();
  </script>
</body>
</html>
