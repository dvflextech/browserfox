<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Celestial Fox Startpage</title>
  <style>
    /* Celestial Palette */
    :root {
      --bg-dark: #03050c;
      --card-bg: rgba(8, 14, 30, 0.75);
      --card-border: rgba(56, 189, 248, 0.25); 
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-gold: #fbbf24;
      --accent-blue: #38bdf8;
      --accent-pink: #f472b6;
      --glow-blue: rgba(56, 189, 248, 0.45);
      --glow-gold: rgba(251, 191, 36, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background Artwork */
    .bg-wrapper {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.85) contrast(1.08);
      animation: ambientPulse 8s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { transform: scale(1); filter: brightness(0.85) contrast(1.08); }
      100% { transform: scale(1.03); filter: brightness(0.92) contrast(1.12); }
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(3, 5, 12, 0.2) 0%, rgba(3, 5, 12, 0.82) 100%);
      z-index: 2;
    }

    /* Main Container - Balances viewport dynamically when drawers open/close */
    .content-container {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 680px;
      padding: 20px;
      transform: translateX(0px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Dynamic Offset Logic for Left and Right Drawers */
    body.debug-open.drawer-closed .content-container { transform: translateX(180px); }
    body.drawer-open.debug-closed .content-container { transform: translateX(-220px); }
    body.drawer-open.debug-open .content-container { transform: translateX(0px); }

    /* Dynamic Search Bar */
    .search-form { width: 100%; }

    .search-box {
      width: 100%;
      background: rgba(6, 11, 24, 0.85);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 50px;
      padding: 16px 32px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 25px var(--glow-blue);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .search-box:focus-within {
      transform: translateY(-3px) scale(1.015);
      border-color: var(--accent-gold);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.8), 0 0 35px var(--glow-gold);
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 1.15rem;
      color: var(--text-main);
      text-align: center;
      font-weight: 500;
    }

    .search-box input::placeholder {
      color: var(--text-sub);
      opacity: 0.7;
    }

    /* Links Grid */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
    }

    .link-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      padding: 12px 14px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .link-card:hover {
      background: rgba(15, 23, 42, 0.9);
      transform: translateY(-4px);
    }
    .link-card.gold:hover { border-color: var(--accent-gold); color: var(--accent-gold); box-shadow: 0 10px 30px var(--glow-gold); }
    .link-card.pink:hover { border-color: var(--accent-pink); color: var(--accent-pink); box-shadow: 0 10px 30px rgba(244, 114, 182, 0.4); }
    .link-card.blue:hover { border-color: var(--accent-blue); color: var(--accent-blue); box-shadow: 0 10px 30px var(--glow-blue); }

    /* Left Debug Console Drawer */
    .debug-drawer {
      position: absolute;
      left: -380px;
      top: 2%;
      height: 96%;
      width: 380px;
      background: rgba(4, 7, 15, 0.92);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-right: 1px solid var(--card-border);
      border-radius: 0 24px 24px 0;
      z-index: 10;
      transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 15px 0 50px rgba(0,0,0,0.65);
      display: flex;
      flex-direction: column;
    }

    body.debug-open .debug-drawer {
      left: 0;
    }

    .debug-toggle {
      position: absolute;
      right: -44px;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 100px;
      background: rgba(4, 7, 15, 0.92);
      backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-left: none;
      border-radius: 0 16px 16px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 0.8rem;
      transition: all 0.2s ease;
      box-shadow: 5px 0 15px rgba(0,0,0,0.3);
    }

    .debug-toggle:hover {
      color: var(--accent-blue);
      background: rgba(15, 23, 42, 0.95);
    }

    .debug-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clear-cache-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text-main);
      padding: 4px 8px;
      font-size: 0.7rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .clear-cache-btn:hover { background: rgba(255,255,255,0.2); }

    .debug-logs {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-entry {
      padding: 6px 8px;
      background: rgba(255,255,255,0.03);
      border-left: 3px solid var(--accent-blue);
      border-radius: 4px;
      word-break: break-all;
    }
    .log-entry.success { border-left-color: #22c55e; color: #a3e635; }
    .log-entry.error { border-left-color: #ef4444; color: #fca5a5; }
    .log-entry.warn { border-left-color: var(--accent-gold); color: #fde047; }

    /* Right Updates Drawer (Defaults Open) */
    .drawer {
      position: absolute;
      right: 0;
      top: 2%;
      height: 96%;
      width: 440px;
      background: rgba(6, 10, 22, 0.88);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-left: 1px solid var(--card-border);
      border-radius: 24px 0 0 24px;
      z-index: 10;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -15px 0 50px rgba(0,0,0,0.65);
      display: flex;
      flex-direction: column;
    }

    body.drawer-closed .drawer {
      right: -440px;
    }

    .drawer-toggle {
      position: absolute;
      left: -44px;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 100px;
      background: rgba(6, 10, 22, 0.88);
      backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-right: none;
      border-radius: 16px 0 0 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-blue);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 0.8rem;
      transition: all 0.2s ease;
      box-shadow: -5px 0 15px rgba(0,0,0,0.3);
    }

    .drawer-toggle:hover {
      color: var(--accent-gold);
      background: rgba(15, 23, 42, 0.95);
    }

    /* Tabs Header */
    .tabs-header {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 20px 20px 0 20px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 10px 0;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      color: var(--accent-gold);
      border-bottom: 2px solid var(--accent-gold);
    }

    .tab-btn:hover:not(.active) {
      color: var(--text-main);
    }

    /* Tab Content Panels */
    .tab-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .feed-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .feed-item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .feed-item:last-child {
      border-bottom: none;
    }

    .feed-thumb {
      width: 64px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .feed-info {
      flex: 1;
      min-width: 0;
    }

    .feed-item a {
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.9rem;
      line-height: 1.35;
      font-weight: 500;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.2s ease;
      margin-bottom: 4px;
    }

    .feed-item a:hover {
      color: var(--accent-blue);
    }

    .tab-content#pv .feed-item a:hover { color: var(--accent-pink); }
    .tab-content#mal .feed-item a:hover { color: var(--accent-gold); }

    .feed-meta {
      font-size: 0.75rem;
      color: var(--text-sub);
      opacity: 0.85;
    }

    .feed-loading {
      text-align: center;
      color: var(--text-sub);
      font-style: italic;
      font-size: 0.95rem;
      margin-top: 30px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
  </style>
</head>
<body class="debug-closed">

  <div class="bg-wrapper"><img src="bg.jpg" alt="Celestial Fox"></div>
  <div class="bg-overlay"></div>

  <!-- Left Debug Console Drawer -->
  <div class="debug-drawer">
    <div class="debug-toggle" onclick="toggleDebug()">DEBUG</div>
    <div class="debug-header">
      <span>FEED DIAGNOSTICS</span>
      <button class="clear-cache-btn" onclick="clearFeedCache()">Clear Cache</button>
    </div>
    <div class="debug-logs" id="debug-logs">
      <div class="log-entry">Console initialized. Ready for feed events...</div>
    </div>
  </div>

  <!-- Central Search & Links -->
  <div class="content-container">
    <form class="search-form" action="https://duckduckgo.com/" method="get">
      <div class="search-box">
        <input type="text" name="q" placeholder="Search" autofocus autocomplete="off">
      </div>
    </form>
    <div class="links-grid">
      <a href="https://nyaa.si" class="link-card blue">Nyaa</a>
      <a href="https://anilist.co" class="link-card gold">AniList</a>
      <a href="https://myanimelist.net" class="link-card blue">MAL</a>
      <a href="https://www.youtube.com" class="link-card pink">YouTube</a>
      <a href="https://www.twitch.tv" class="link-card pink">Twitch</a>
      <a href="https://reddit.com" class="link-card blue">Reddit</a>
      <a href="https://sukebei.nyaa.si" class="link-card pink">Sukebei</a>
      <a href="https://imdb.com" class="link-card gold">IMDb</a>
    </div>
  </div>

  <!-- Right Collapsible Updates Drawer (Defaults Open) -->
  <div class="drawer">
    <div class="drawer-toggle" onclick="toggleDrawer()">UPDATES</div>
    
    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab('ann')">ANN</button>
      <button class="tab-btn" onclick="switchTab('mal')">MAL</button>
      <button class="tab-btn" onclick="switchTab('nyaa')">NYAA</button>
      <button class="tab-btn" onclick="switchTab('pv')">Previews</button>
    </div>

    <!-- ANN Content -->
    <div class="tab-content active" id="ann">
      <ul class="feed-list" id="list-ann"><li class="feed-loading">Fetching ANN...</li></ul>
    </div>
    <!-- MAL Content -->
    <div class="tab-content" id="mal">
      <ul class="feed-list" id="list-mal"><li class="feed-loading">Fetching MAL...</li></ul>
    </div>
    <!-- Nyaa Content -->
    <div class="tab-content" id="nyaa">
      <ul class="feed-list" id="list-nyaa"><li class="feed-loading">Fetching Nyaa...</li></ul>
    </div>
    <!-- Previews / Trailers Content -->
    <div class="tab-content" id="pv">
      <ul class="feed-list" id="list-pv"><li class="feed-loading">Fetching Previews...</li></ul>
    </div>
  </div>

  <script>
    function logDebug(message, type = 'info') {
      const logsContainer = document.getElementById('debug-logs');
      if (!logsContainer) return;
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = `[${timestamp}] ${message}`;
      logsContainer.appendChild(entry);
      logsContainer.scrollTop = logsContainer.scrollHeight;
    }

    function toggleDrawer() {
      document.body.classList.toggle('drawer-closed');
      document.body.classList.toggle('drawer-open');
    }

    function toggleDebug() {
      document.body.classList.toggle('debug-open');
      document.body.classList.toggle('debug-closed');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function clearFeedCache() {
      Object.keys(localStorage).forEach(key => {
        if (key.startsWith('celestial_cache_')) {
          localStorage.removeItem(key);
        }
      });
      logDebug('Local storage feed cache cleared. Reloading page recommended.', 'success');
      alert('Feed cache cleared! Refresh the page to fetch fresh feeds.');
    }

    async function loadFeedWithCache(rssUrl, listId, maxItems = 7) {
      const listElement = document.getElementById(listId);
      const cacheKey = `celestial_cache_${listId}`;
      const cacheTimeKey = `${cacheKey}_time`;
      
      const cachedData = localStorage.getItem(cacheKey);
      const cachedTime = localStorage.getItem(cacheTimeKey);
      const twentyFourHours = 24 * 60 * 60 * 1000;

      // 1. Use valid cache if under 24 hours old
      if (cachedData && cachedTime && (Date.now() - parseInt(cachedTime, 10) < twentyFourHours)) {
        logDebug(`[${listId}] Loaded from 24h browser cache successfully`, 'success');
        renderItems(JSON.parse(cachedData), listId, maxItems);
        return;
      }

      logDebug(`[${listId}] Cache expired, missing, or previously failed. Attempting fetch...`);

      // 2. Fetch from network via proxy fallback strategy
      const proxies = [
        (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
        (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`
      ];

      let rawText = null;
      for (let i = 0; i < proxies.length; i++) {
        try {
          const response = await fetch(proxies[i](rssUrl));
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          
          if (i === 0) {
            const data = await response.json();
            if (data && data.contents) { rawText = data.contents; break; }
          } else {
            rawText = await response.text();
            if (rawText) { break; }
          }
        } catch (err) {
          logDebug(`[${listId}] Proxy #${i + 1} failed: ${err.message}`, 'warn');
        }
      }

      // 3. Handle network failure (DO NOT cache error state; fall back to stale cache if available, or retry later)
      if (!rawText) {
        logDebug(`[${listId}] Network/Proxy fetch failed. Not caching error.`, 'error');
        if (cachedData) {
          logDebug(`[${listId}] Falling back to older stale cached data due to network error.`, 'warn');
          renderItems(JSON.parse(cachedData), listId, maxItems);
        } else {
          listElement.innerHTML = '<li class="feed-loading">Connection error. Retrying on next load...</li>';
        }
        return;
      }

      // 4. Parse XML and validate contents before caching
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(rawText, 'text/xml');
        
        if (xmlDoc.querySelector('parsererror')) {
          throw new Error('Invalid XML format');
        }

        const items = xmlDoc.querySelectorAll('item');
        const parsedItems = [];

        items.forEach(item => {
          const title = item.querySelector('title')?.textContent || '';
          const link = item.querySelector('link')?.textContent || '#';
          const pubDateStr = item.querySelector('pubDate')?.textContent;
          const date = pubDateStr ? new Date(pubDateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

          // Strict validation: Skip malformed entries missing valid titles or links (fixes empty/untitled entries)
          if (!title.trim() || !link.trim() || link === '#') return;

          const description = item.querySelector('description')?.textContent || '';
          const contentEncoded = item.getElementsByTagNameNS('*', 'encoded')[0]?.textContent || '';
          const combinedHtml = description + ' ' + contentEncoded;

          let thumbUrl = null;
          const mediaContent = item.getElementsByTagNameNS('*', 'content')[0];
          if (mediaContent && mediaContent.getAttribute('url')) {
            thumbUrl = mediaContent.getAttribute('url');
          } else {
            const enclosure = item.querySelector('enclosure');
            if (enclosure && enclosure.getAttribute('type')?.startsWith('image')) {
              thumbUrl = enclosure.getAttribute('url');
            }
          }

          if (!thumbUrl && combinedHtml) {
            const doc = parser.parseFromString(combinedHtml, 'text/html');
            const img = doc.querySelector('img');
            if (img && img.src) { thumbUrl = img.src; }
          }

          parsedItems.push({ title, link, date, thumbUrl });
        });

        // 5. Ensure we only cache successfully parsed valid items (prevents caching empty/broken payloads)
        if (parsedItems.length > 0) {
          localStorage.setItem(cacheKey, JSON.stringify(parsedItems));
          localStorage.setItem(cacheTimeKey, Date.now().toString());
          
          renderItems(parsedItems, listId, maxItems);
          logDebug(`[${listId}] Successfully cached ${parsedItems.length} valid items for 24 hours`, 'success');
        } else {
          logDebug(`[${listId}] Parsed zero valid items. Cache skipped to allow future retry.`, 'warn');
          if (cachedData) {
            renderItems(JSON.parse(cachedData), listId, maxItems);
          } else {
            listElement.innerHTML = '<li class="feed-loading">Feed temporarily unavailable.</li>';
          }
        }
      } catch (parseErr) {
        logDebug(`[${listId}] Parsing error: ${parseErr.message}. Cache skipped.`, 'error');
        if (cachedData) {
          renderItems(JSON.parse(cachedData), listId, maxItems);
        } else {
          listElement.innerHTML = '<li class="feed-loading">Parsing error.</li>';
        }
      }
    }

    function renderItems(items, listId, maxItems) {
      const listElement = document.getElementById(listId);
      listElement.innerHTML = '';
      
      items.slice(0, maxItems).forEach(item => {
        const li = document.createElement('li');
        li.className = 'feed-item';
        
        let thumbHtml = item.thumbUrl ? `<img class="feed-thumb" src="${item.thumbUrl}" alt="" loading="lazy">` : '';

        li.innerHTML = `
          ${thumbHtml}
          <div class="feed-info">
            <a href="${item.link}" target="_blank" title="${item.title}">${item.title}</a>
            <div class="feed-meta">${item.date}</div>
          </div>
        `;
        listElement.appendChild(li);
      });
    }

    // Set initial drawer state
    document.body.classList.add('drawer-open');

    // Initialize feeds with resilient 24-hour error-safe caching
    loadFeedWithCache('https://www.animenewsnetwork.com/all/rss.xml', 'list-ann');
    loadFeedWithCache('https://myanimelist.net/rss/news.xml', 'list-mal');
    loadFeedWithCache('https://nyaa.si/?page=rss', 'list-nyaa');
    loadFeedWithCache('https://www.animenewsnetwork.com/encyclopedia/reports.xml?id=155', 'list-pv');
  </script>
</body>
</html>
